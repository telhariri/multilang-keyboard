name: Build, Test, and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ mingw-w64 libfcitx5core-dev libx11-dev python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Python test suite and CLI checks
        run: |
          python -W error::DeprecationWarning -m unittest discover -s tests -v
          python main.py --self-test
          python main.py --version
      - name: Run Rust unit tests and Windows cross-check
        run: |
          cargo test --manifest-path native/Cargo.toml
          RUSTFLAGS="-D warnings" cargo check --manifest-path native/Cargo.toml --target x86_64-pc-windows-gnu --tests
      - name: Build and test Fcitx5 Wayland module
        run: |
          cmake -S wayland/fcitx5 -B build/fcitx5 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/fcitx5 --parallel
          ctest --test-dir build/fcitx5 --output-on-failure
      - name: Build and verify Linux release archive
        run: |
          ./scripts/build-linux-release.sh
          tmpdir="$(mktemp -d)"
          tar -xzf dist/Multilang-Linux-x64.tar.gz -C "$tmpdir"
          bundle="$tmpdir/Multilang-Linux-x64"
          bash -n "$bundle"/scripts/*.sh
          python "$bundle/main.py" --self-test
          python "$bundle/main.py" --version
          rm -rf "$tmpdir"
      - name: Upload Linux release archive
        uses: actions/upload-artifact@v7
        with:
          name: Multilang-Linux-x64
          path: dist/Multilang-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run Python tests and CLI checks
        run: |
          python -W error::DeprecationWarning -m unittest discover -s tests -v
          python main.py --self-test
          python main.py --version
      - name: Build and test the native Windows hook
        run: |
          cargo build --manifest-path native/Cargo.toml
          cargo test --manifest-path native/Cargo.toml -- --test-threads=1
      - name: Build the release DLL and desktop application
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --manifest-path native/Cargo.toml --release --target x86_64-pc-windows-msvc
          Copy-Item native/target/x86_64-pc-windows-msvc/release/multilang_native.dll native/multilang_native.dll
          python -m PyInstaller --noconfirm --clean multilang.spec
          foreach ($flag in @("--help", "--self-test", "--version")) {
            $proc = Start-Process -FilePath "dist/Multilang/Multilang.exe" -ArgumentList $flag -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "Packaged application $flag check failed: $($proc.ExitCode)"
            }
          }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer and portable package
        shell: pwsh
        run: |
          $appVersion = (python -c "import main; print(main.__version__)").Trim()
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { $appVersion }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          Compress-Archive -Path dist/Multilang/* -DestinationPath Multilang-Windows-x64.zip -CompressionLevel Optimal
      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: Multilang-Windows-x64
          path: |
            windows/Multilang-Setup.exe
            Multilang-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare checksums and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist-release
          find release-assets -type f -exec cp -f {} dist-release/ \;
          (
            cd dist-release
            sha256sum Multilang-Setup.exe Multilang-Windows-x64.zip Multilang-Linux-x64.tar.gz > SHA256SUMS.txt
            ls -lh
          )
          python3 - "$TAG" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1].lstrip("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(tag)}\].*?\n(.*?)(?=\n## \[|\Z)", re.S | re.M)
          match = pattern.search(changelog)
          if match:
              Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
          if [[ -s release-notes.md ]]; then
            gh release create "$TAG" \
              dist-release/Multilang-Setup.exe \
              dist-release/Multilang-Windows-x64.zip \
              dist-release/Multilang-Linux-x64.tar.gz \
              dist-release/SHA256SUMS.txt \
              --title "Multilang $TAG" \
              --latest \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              dist-release/Multilang-Setup.exe \
              dist-release/Multilang-Windows-x64.zip \
              dist-release/Multilang-Linux-x64.tar.gz \
              dist-release/SHA256SUMS.txt \
              --title "Multilang $TAG" \
              --latest \
              --generate-notes
          fi
